# Pre-commit hooks for the XC Data Platform.
#
# Secret hygiene (Requirement 16.4): the gitleaks hook scans staged changes and
# BLOCKS the commit when a likely credential is detected, reporting the affected
# path without printing the full secret.
#
# Install once per clone:
#     pip install pre-commit==4.0.1
#     pre-commit install
#
# Run manually against all files:
#     pre-commit run --all-files
#
# Versions are pinned exactly (no floating ranges) per Requirement 16.7.
minimum_pre_commit_version: "4.0.1"

repos:
  # Secret scanner. Pinned to an exact release tag.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets (gitleaks)
        # The upstream hook entry is already:
        #     gitleaks protect --verbose --redact --staged
        # pre-commit APPENDS `args` to that entry, so only the extra flag goes
        # here. Repeating `protect --staged --redact` would pass a second
        # `protect` as a stray positional argument.
        args: ["--config", ".gitleaks.toml"]

  # Baseline file-hygiene checks (also catch accidental large/secret files).
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=5000"]
      - id: check-yaml
        files: ^(\.pre-commit-config\.yaml|\.github/workflows/.*\.ya?ml)$

  # Dependency pinning (Requirement 16.7). Catches open ranges, an unhashed
  # lockfile entry, and requirements.txt drifting from requirements.in at commit
  # time rather than waiting for CI. Stdlib only, no network.
  - repo: local
    hooks:
      - id: check-dependency-pins
        name: Verify dependency pins and lockfile hashes
        entry: python scripts/check_dependency_pins.py
        language: system
        pass_filenames: false
        files: ^(requirements\.(in|txt|lock)|scripts/check_dependency_pins\.py)$

      # `files` restricts this hook to competing lockfiles, so it only runs when
      # one is staged. Reaching it at all is the failure.
      - id: no-competing-frontend-lockfiles
        name: Reject npm/yarn lockfiles in web/ (pnpm only)
        entry: web/ uses pnpm only. Delete this lockfile and run 'pnpm install'.
        language: fail
        files: ^web/(package-lock\.json|yarn\.lock|npm-shrinkwrap\.json)$
