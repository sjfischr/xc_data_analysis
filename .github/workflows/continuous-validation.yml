# Continuous validation CI (Task 1.5)
#
# Implements the build/test portion of Requirements 16, 18, and 20.5:
#   * Python checks: ruff lint + format, strict mypy, pytest with coverage.
#   * Frontend checks: frozen-lockfile install plus any lint/typecheck/test/
#     build scripts the web workspace defines (picked up automatically once
#     Task 14.x adds them).
#   * Markdown/spec link validation across docs, spec, and skills.
#
# Secret scanning and dependency auditing run in the companion workflow
# .github/workflows/secret-and-dependency-hygiene.yml (Task 1.2).
#
# Scope guardrails (spec execution rules):
#   * Static checks and unit tests ONLY. This workflow never invokes Tavily,
#     Bedrock, AgentCore, or live RunSignup endpoints (Requirement 20.5); unit
#     tests use dummy credential-shaped values exclusively.
#   * Published artifacts are concise test/coverage reports. They contain no
#     source credentials and no youth data beyond approved fixtures.
#
# Pinning (Requirement 16.7): actions are pinned by commit SHA; tools install
# from the hashed requirements.lock. Update via docs/dependency-review.md.

name: Continuous validation

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-checks:
    name: Python lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install locked dependencies (hash-verified)
        # Single source of truth: the same hashed lockfile used everywhere
        # else. Includes the pinned dev toolchain (ruff, mypy, pytest,
        # pytest-cov) added by Task 1.3.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==24.3.1
          python -m pip install --require-hashes --requirement requirements.lock

      - name: Ruff lint
        run: python -m ruff check src scripts tests

      - name: Ruff format check
        run: python -m ruff format --check src scripts tests

      - name: Mypy (strict, per pyproject.toml)
        run: python -m mypy

      - name: Pytest with coverage
        run: |
          python -m pytest src tests -q -m "not live and not integration" \
            --cov=src/xc_platform \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --junit-xml=pytest-report.xml

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: python-test-reports
          path: |
            coverage.xml
            pytest-report.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend-checks:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm (pinned)
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: "10.26.1"

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20.19.1"

      - name: Install with frozen lockfile
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Run workspace checks (lint, typecheck, test, build)
        # --if-present keeps this green while web/ is still a scaffold; the
        # scripts run automatically once Task 14.x defines them.
        working-directory: web
        run: |
          set -euo pipefail
          pnpm run --if-present lint
          pnpm run --if-present typecheck
          pnpm run --if-present test
          pnpm run --if-present build

  docs-link-validation:
    name: Markdown and spec link validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Validate relative Markdown links and anchors
        # Stdlib-only static check; external URLs are deliberately not fetched.
        run: python scripts/check_markdown_links.py --github
