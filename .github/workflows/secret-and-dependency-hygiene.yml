# Secret and dependency hygiene CI (Task 1.2)
#
# Implements the automated portion of Requirements 16.3-16.8 and 18.6:
#   * Secret scanning that BLOCKS the build on a likely credential and reports
#     the affected path without printing the full secret (gitleaks --redact).
#   * Dependency auditing for Python and the frontend workspace.
#   * Lockfile-integrity verification so pinned/locked versions cannot drift
#     silently.
#
# Scope guardrails (spec execution rules):
#   * This workflow performs static checks ONLY. It never calls Tavily,
#     Bedrock, AgentCore, or any live RunSignup endpoint, and it never reads a
#     real credential. Secret values are redacted in all output.
#
# Pinning (Requirement 16.7): third-party actions are pinned by commit SHA and
# tool versions to exact releases. Update deliberately via the process in
# docs/dependency-review.md.

name: Secret and dependency hygiene

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in lockstep with the `rev` in .pre-commit-config.yaml so the hook and
  # CI enforce byte-identical rules. See docs/dependency-review.md section 4.3.
  GITLEAKS_VERSION: "8.21.2"
  # SHA-256 of gitleaks_8.21.2_linux_x64.tar.gz, taken from the official
  # gitleaks_8.21.2_checksums.txt published with release v8.21.2.
  GITLEAKS_SHA256: "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba"

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history so the history scan is meaningful)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install gitleaks (exact version, checksum verified)
        # Installing the pinned binary directly rather than via a wrapper
        # action guarantees CI runs the same gitleaks version as the
        # pre-commit hook, and removes any license/token requirement.
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 2 --max-time 120 \
            --output "$archive" "$url"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f "$archive"
          gitleaks version

      - name: Scan full repository history
        # --redact ensures findings identify the path and rule without printing
        # the secret value (Requirement 16.4). A non-zero exit blocks the build.
        run: |
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --log-opts="--all" \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --verbose

      - name: Upload redacted findings report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          if-no-files-found: ignore
          retention-days: 7

  python-hygiene:
    name: Python dependency audit and lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Verify pinning and lockfile hash coverage
        # Pure static check: exact pins only, requirements.txt consistent with
        # requirements.in, and every locked requirement carries a hash. Runs
        # before any install so a pinning defect fails fast.
        run: python scripts/check_dependency_pins.py --github

      - name: Install audit tooling (pinned)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==24.3.1
          python -m pip install pip-audit==2.7.3 pip-tools==7.4.1

      - name: Verify requirements.lock is in sync with requirements.in
        # Re-locks IN PLACE and diffs against a pristine copy.
        #
        # In-place matters for two reasons:
        #   1. Without --upgrade, pip-compile reuses the versions already in its
        #      output file as constraints. Compiling to a fresh filename would
        #      instead resolve every transitive dependency to its newest
        #      release, so this job would fail whenever an unrelated upstream
        #      package published a version.
        #   2. The generated header records the --output-file argument verbatim,
        #      so a different filename would diff on the header alone.
        #
        # A real diff therefore means requirements.in changed without re-locking.
        run: |
          set -euo pipefail
          cp requirements.lock requirements.lock.orig
          pip-compile --quiet --generate-hashes \
            --output-file requirements.lock requirements.in
          if ! diff -u requirements.lock.orig requirements.lock; then
            echo "::error::requirements.lock is out of date. Run: pip-compile --generate-hashes --output-file requirements.lock requirements.in"
            cp requirements.lock.orig requirements.lock
            rm -f requirements.lock.orig
            exit 1
          fi
          rm -f requirements.lock.orig
          echo "requirements.lock is in sync with requirements.in."

      - name: Audit Python dependencies for known vulnerabilities
        # Audits the fully pinned, fully hashed lockfile. Hashes imply a
        # resolved file, so no further dependency resolution occurs.
        # --strict fails the job if any dependency had to be skipped.
        run: pip-audit --strict --require-hashes --requirement requirements.lock

  frontend-hygiene:
    name: Frontend dependency audit and lockfile integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm (pinned)
        uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: "10.26.1"

      - name: Set up Node
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20.19.1"

      - name: Reject competing lockfiles
        # pnpm is the single supported package manager for web/. A stray npm or
        # yarn lockfile would silently bypass the integrity check below.
        run: |
          set -euo pipefail
          for stray in web/package-lock.json web/yarn.lock web/npm-shrinkwrap.json; do
            if [ -f "$stray" ]; then
              echo "::error file=$stray::Unexpected lockfile. web/ uses pnpm only; delete this file."
              exit 1
            fi
          done
          test -f web/pnpm-lock.yaml || {
            echo "::error::web/pnpm-lock.yaml is missing."
            exit 1
          }
          echo "Frontend lockfile layout is correct."

      - name: Verify frozen lockfile installs cleanly
        # --frozen-lockfile fails if package.json and pnpm-lock.yaml disagree,
        # preventing silent version drift.
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Audit frontend dependencies for known vulnerabilities
        working-directory: web
        # Fail the build on moderate-or-higher advisories.
        run: pnpm audit --audit-level moderate

  redaction-tests:
    name: Log-redaction tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"

      - name: Install test runner (pinned)
        # Matches the pytest pin in requirements.in/requirements.lock (Task
        # 1.3) so this fast job and the full continuous-validation workflow
        # run the same test-runner version.
        run: python -m pip install pytest==8.3.0

      - name: Run redaction and secret-config tests
        # Requirements 16.6 and 18.6: credentials, authorization headers,
        # session cookies, and sensitive query parameters must be redacted from
        # logs and traces. These tests use dummy credential-shaped values only.
        #
        # No PYTHONPATH is needed: src/ has no __init__.py, so pytest's default
        # prepend import mode walks up to src/ and puts it on sys.path, making
        # xc_platform importable.
        run: python -m pytest src/xc_platform/security -q
